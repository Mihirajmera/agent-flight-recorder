[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "Audit-grade flight recorder for AI agents: policy on every MCP tool call, a signed hash-chained log, and OSCAL evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mihir Ajmera" }]
dependencies = ["pyyaml>=6.0,<7", "cryptography>=42"]
keywords = ["ai-security", "ai-governance", "mcp", "ai-agents", "audit-log", "grc", "oscal", "iso-42001", "eu-ai-act"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/Mihirajmera/agent-flight-recorder"
Issues = "https://github.com/Mihirajmera/agent-flight-recorder/issues"

[project.scripts]
afr = "agent_flight_recorder.__main__:main"
agent-flight-recorder = "agent_flight_recorder.__main__:main"

[tool.setuptools]
packages = ["agent_flight_recorder"]

[tool.setuptools.package-data]
agent_flight_recorder = ["*.yaml", "examples/*"]
